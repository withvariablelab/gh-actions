rules:
  unpinned-uses:
    config:
      policies:
        # First-party: consumers and preview-comment.yml track
        # withvariablelab/gh-actions at @main on purpose (Regla 4 of the
        # migration plan). main is protected by rulesets (PR required, signed
        # commits, no force-push or deletion), and pinning the self-reference
        # by SHA would need a follow-up commit after every change.
        "withvariablelab/*": ref-pin
        # Everything else must be pinned to a full commit SHA.
        "*": hash-pin
