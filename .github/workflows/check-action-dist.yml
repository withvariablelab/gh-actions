name: Check actions dist sync

# No paths filter: dist/ is what consumers run, and a required check must always run.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test and check dist
    runs-on: ubuntu-latest
    env:
      MISE_EXPERIMENTAL: "1"
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          experimental: true

      - name: 📦 Install dependencies
        run: mise run setup

      - name: 🪞 Check shared comment code
        run: |
          for file in comment.ts comment.test.ts core.test.ts types.ts; do
            diff -u "actions/preview-release/src/$file" "actions/monorepo-preview-release/src/$file"
          done

      - name: 🧪 Test
        run: mise run test

      # Prints only file names and a --stat, never PR-controlled contents.
      - name: 🧪 Check dist
        run: |
          if ! mise run check-dist; then
            echo "::error::dist/ is out of sync with src/. Run 'mise run check-dist' locally and commit the rebuilt dist/."
            exit 1
          fi
