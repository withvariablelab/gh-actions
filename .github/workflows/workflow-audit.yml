# Static security analysis of the GitHub Actions workflows (zizmor).
# Config and reviewed exceptions: .github/zizmor.yml

name: Workflow audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: 🔒 Run zizmor
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .
        env:
          # Read-only token for zizmor's online audits.
          GH_TOKEN: ${{ github.token }}
