name: Workflow audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Scan workflows
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .
        env:
          # Read-only token for zizmor's online audits.
          GH_TOKEN: ${{ github.token }}
