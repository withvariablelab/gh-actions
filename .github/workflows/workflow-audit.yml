# Workflow audit
#
# Scans every GitHub Actions workflow in .github/ with zizmor, a static
# analyzer for CI security mistakes: untrusted input interpolated into
# shell commands, credentials left behind by checkout, actions not pinned
# to a commit SHA, overly broad permissions, dangerous triggers such as
# pull_request_target. The check fails when a workflow introduces one.
# Config and reviewed exceptions: .github/zizmor.yml

name: Workflow audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # pipx ships with the GitHub-hosted Ubuntu image, so no third-party
      # setup action is needed.
      - name: 🔒 Scan .github/ for insecure workflow patterns
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .
        env:
          # Enables the online audits (impostor commits, known-vulnerable
          # actions, ref confusion). Read-only: the job has contents: read.
          GH_TOKEN: ${{ github.token }}
