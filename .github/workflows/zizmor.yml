name: zizmor

# Security lint for the workflows and composite actions in this repo
# (template injection, credential persistence, unpinned actions, excessive
# permissions...). Config: .github/zizmor.yml

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # pipx ships with the GitHub-hosted Ubuntu image, so no third-party
      # setup action is needed.
      - name: 🔒 Run zizmor
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .
        env:
          # Enables the online audits (impostor commits, known-vulnerable
          # actions, ref confusion). Read-only: the job has contents: read.
          GH_TOKEN: ${{ github.token }}
