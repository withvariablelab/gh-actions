name: Preview comment

on:
  workflow_call:
    inputs:
      packages:
        description: "`packages` output of the publish job. Untrusted; the action validates it."
        type: string
        required: true
      action:
        description: "`preview-release` or `monorepo-preview-release`, matching the publish job."
        type: string
        required: true
    secrets:
      VLAND_BOT_PRIVATE_KEY:
        description: Private key of the vland-bot GitHub App.
        required: true

permissions: {}

jobs:
  # Holds the bot key: never check out or run PR code here.
  comment:
    name: Comment preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 🔍 Validate inputs
        if: ${{ inputs.action != 'preview-release' && inputs.action != 'monorepo-preview-release' }}
        run: |
          echo "::error::inputs.action must be 'preview-release' or 'monorepo-preview-release'"
          exit 1

      - name: 🔑 Mint bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VLAND_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
          # No owner/repositories: the token only covers the calling repo.
          permission-pull-requests: write

      - name: 💬 Comment (preview-release)
        if: ${{ inputs.action == 'preview-release' }}
        uses: withvariablelab/gh-actions/actions/preview-release@main
        with:
          mode: comment
          packages: ${{ inputs.packages }}
          github_token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}

      - name: 💬 Comment (monorepo-preview-release)
        if: ${{ inputs.action == 'monorepo-preview-release' }}
        uses: withvariablelab/gh-actions/actions/monorepo-preview-release@main
        with:
          mode: comment
          packages: ${{ inputs.packages }}
          github_token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
