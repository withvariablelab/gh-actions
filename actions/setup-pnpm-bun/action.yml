name: setup-pnpm-bun

description: "Deprecated: install node, pnpm and bun with mise (jdx/mise-action) instead. Prepare PNPM and Bun, cache dependencies, and install dependencies"

runs:
  using: composite

  steps:
    - name: 📦 Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        run_install: false

    # Exact pin (OIDC needs >= 11.5.1): runs as root in jobs holding id-token or the bot token; bump both setup actions together to a release >= 24 h old.
    - name: 📦 Update npm
      shell: bash
      run: | # zizmor: ignore[adhoc-packages] global npm CLI, exact version pinned on purpose (see the comment above)
        if command -v sudo >/dev/null 2>&1; then
          sudo npm install -g npm@11.21.0
        else
          npm install -g npm@11.21.0
        fi

    - name: 🫙 Export pnpm store path
      id: pnpm-config
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: 🔑 Export cache rotation key
      id: cache-rotation
      shell: bash
      run: |
        echo "ROTATION_KEY=$(/bin/date -u "+%Y%m")" >> $GITHUB_OUTPUT

    - name: 🔁 Cache dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pnpm-config.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-cache-${{ steps.cache-rotation.outputs.ROTATION_KEY }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-cache-${{ steps.cache-rotation.outputs.ROTATION_KEY }}-

    - name: 📥 Install dependencies
      run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash # required for composite actions

    - name: 🔍 .bun-version
      shell: bash
      run: |
        if [ ! -f ".bun-version" ]; then
          echo "❌ Error: .bun-version file not found. This file is required to configure the correct version of Bun."
          exit 1
        fi

    - name: 🥟 Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ".bun-version"

    - name: 🔍 Log versions
      shell: bash
      run: |
        echo "pnpm version: $(pnpm -v)"
        echo "npm version: $(npm -v)"
        echo "bun version: $(bun -v)"
