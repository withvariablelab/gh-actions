experimental_monorepo_root = true

[monorepo]
config_roots = ['actions/*']

[env]
MISE_EXPERIMENTAL = "1"
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
node = '24'
pnpm = '10.30.3'

[tasks.setup]
description = 'install tools + root deps + per-action deps'
run = ['mise install', 'pnpm install', 'mise run "//actions/...:setup"']

[tasks.tsc]
description = 'typecheck across all actions'
run = 'mise run "//actions/...:tsc"'

[tasks."check"]
description = 'static checks across all actions'
run = 'mise run "//actions/...:check"'

[tasks.test]
description = 'unit tests across every action that declares the task'
run = 'mise run "//actions/...:test"'

[tasks.build]
description = 'build dist/ for every Node action that declares the task'
run = 'mise run "//actions/...:build"'

[tasks.check-dist]
description = 'force-rebuild every dist/ and fail if it differs from the committed one'
# --force: the per-action build tasks skip when dist/ is newer than src/, so a
# hand-edited dist/ would otherwise be left as is and pass. The pathspec needs
# the explicit glob: plain 'actions/*/dist' matches no file beneath dist/.
run = '''
mise run --force "//actions/...:build"
changes="$(git status --porcelain --untracked-files=all -- ':(glob)actions/*/dist/**')"
if [ -n "$changes" ]; then
  echo "$changes"
  git --no-pager diff --stat -- ':(glob)actions/*/dist/**'
  echo "dist/ is out of sync with src/. The rebuilt dist/ is now in the working tree: review it and commit it." >&2
  exit 1
fi
'''
