pre-commit:
  jobs:
    - name: static check
      run: mise run check
      glob:
        - "actions/**/*.{ts,tsx}"
        - "actions/**/tsconfig.json"

pre-push:
  jobs:
    - name: unit tests
      run: mise run test
      glob:
        - "actions/*/src/**"
        - "actions/*/package.json"

    - name: verify action dist
      run: mise run check-dist
      glob:
        - "actions/*/src/**"
        - "actions/*/dist/**"
        - "actions/*/package.json"
        - "actions/*/package-lock.json"
        - "actions/*/tsconfig.json"
