extends:
  - node_modules/@rrlab/cli/lefthook/base.yml
  - lefthook/actions.yml

pre-commit:
  jobs:
    - name: shared-hooks
      run: |
        if [ ! -f node_modules/@rrlab/cli/lefthook/base.yml ]; then
          echo "@rrlab/cli's git hooks are missing from node_modules: run pnpm install, then commit again."
          exit 1
        fi

pre-push:
  jobs:
    - name: unit tests
      run: mise run test
      glob:
        - "actions/*/src/**"
        - "actions/*/package.json"

    - name: verify action dist
      run: mise run check-dist
      glob:
        - "actions/*/src/**"
        - "actions/*/dist/**"
        - "actions/*/package.json"
        - "actions/*/package-lock.json"
        - "actions/*/tsconfig.json"
